packaging_format = 2
id = "photoselect"
name = "PhotoSelect"
description.en = "Private client photo proofing galleries for photographers."
description.sl = "Zasebne fotografske galerije za izbor fotografij."
version = "0.1.0~ynh2"
maintainers = ["wazingawalz"]

[integration]

yunohost = ">= 11.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "100M"
ram.build = "128M"
ram.runtime = "128M"

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/photoselect"

[install.init_main_permission]
type = "group"
default = "visitors"

[resources]
[resources.system_user]
[resources.install_dir]
[resources.permissions]
main.url = "/"
main.allowed = "visitors"
main.auth_header = false

[resources.apt]
packages = ["php8.2-fpm", "php8.2-sqlite3", "php8.2-gd", "php8.2-mbstring", "php8.2-xml", "php8.2-curl", "php8.2-zip", "php8.2-imagick", "sqlite3"]
